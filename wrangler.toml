name = "redmine-mcp-server"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Set secrets via CLI (never commit actual values):
#   wrangler secret put REDMINE_URL
#   wrangler secret put REDMINE_API_KEY
#   wrangler secret put MCP_AUTH_TOKEN   # required — protects the endpoint

# Hardening: keep minimum source visibility (smaller attack surface in errors)
minify = true
no_bundle = false
keep_vars = false

# Smart placement: routes invocation closer to upstream Redmine to reduce
# round-trip exposure of bearer token across regions
[placement]
mode = "smart"

# Observability: structured logs for auditing auth failures / abuse
[observability]
enabled = true
head_sampling_rate = 1.0

# Hard cap CPU per request — limits damage from runaway/abuse loops
[limits]
cpu_ms = 50
